services:
  - type: web
    name: wardpulse-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SESSION_SECRET
        generateValue: true
      - key: KEEP_ALIVE_URL
        value: https://wardpulse-backend.onrender.com/api/health
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "300000"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: postgres://37ca9ca15fbd73726e67a185a0fe0ad5556c8c6076be9dd77f4b26b40de8eb6c:sk_vih4gOVH-8iPwsC-8rVf8@db.prisma.io:5432/postgres?sslmode=require
