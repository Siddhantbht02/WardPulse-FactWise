services:
  - type: web
    name: wardpulse
    env: node
    plan: starter
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      - key: KEEP_ALIVE_URL
        value: https://wardpulse.onrender.com/api/health
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "300000"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: wardpulse-db
          property: connectionString

databases:
  - name: wardpulse-db
    databaseName: wardpulse
    user: wardpulse
    plan: starter
    region: oregon

